name: Deploy to MilesWeb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /ResHome/
          # Default dangerous-clean-slate is false — this only uploads files
          # present in the repo, it never deletes anything that exists on the
          # server but isn't tracked in git (config.php, backups/*.sql,
          # logs/*.log, the harvest_log data, etc. are all safe).
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/config.php
